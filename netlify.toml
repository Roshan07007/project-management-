# Netlify Configuration for TaskFlow Frontend
# Netlify builds and deploys only the frontend. Backend is deployed separately on Render.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-Page Application (SPA) client-side routing rewrite for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
